<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Links</title>
<style>
:root{--bg:#000;--fg:#f2f2f2;--muted:#9a9a9a;--card:rgba(255,255,255,.08);--card-h:rgba(255,255,255,.2);--line:rgba(255,255,255,.25);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;color:var(--fg);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#bgvideo{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-3}
#bgvideo{filter:grayscale(1) contrast(1.15) brightness(.7);display:none}
.overlay{position:fixed;inset:0;z-index:-1;pointer-events:none;
background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,.85) 100%),
repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px)}
main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 20px;gap:28px;background:transparent;}
.profile{text-align:center}
.avatar{width:96px;height:96px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:36px;font-weight:700;margin:0 auto 14px;backdrop-filter:blur(8px);letter-spacing:-1px}
h1{margin:0;font-size:1.5rem;letter-spacing:.02em}
.bio{margin:6px 0 0;color:var(--muted);font-size:.95rem}
nav{width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px}
nav a{display:block;text-align:center;padding:16px 20px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg);text-decoration:none;font-weight:600;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .2s,background .2s,border-color .2s}
nav a:hover,nav a:focus-visible{background:var(--card-h);border-color:#fff;transform:translateY(-2px) scale(1.01);outline:none}
nav a:active{transform:scale(.98)}
footer{color:var(--muted);font-size:.8rem}
@media (prefers-reduced-motion:reduce){nav a{transition:none}}
</style>
</head>
<body>
<!-- OPTIONAL: put your own video file URL below (mp4/webm). It will be turned black & white automatically. -->
<video id="bgvideo" muted loop playsinline autoplay></video>
<div class="overlay"></div>

<main>
  <div class="profile">
    <div class="avatar">Y</div>
    <h1>Pablo Bigaku</h1>
    <p class="bio">Fotografo - Desenvolvedor de software</p>
  </div>
  <nav>
    <a href="https://www.instagram.com/bigaku.photos/" target="_blank" rel="noopener">Instagram</a>
    <a href="wa.link/5p6act" target="_blank" rel="noopener">WhatsApp</a>
  </nav>
  <footer>© 2026 Pablo Bigaku</footer>
</main>

<script>
// ---- Config: set a video URL to use a real video as background ----
var VIDEO_URL = "100-free-stock-footage-no-copyright---dark-cinematic-background.mp4";
if (VIDEO_URL) {
  var v = document.getElementById("bgvideo");
  v.src = VIDEO_URL; v.style.display = "block";
  v.play().catch(function(){});
}

</script>
</body>
</html>
